name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-only deps (cryptography + tomli for 3.9)
        run: python -m pip install --quiet cryptography tomli

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run attack repro (tamper-resistance)
        run: python tests/attack_repro.py

      - name: Performance regression gate (50k events < 3s append)
        run: python tools/benchmark.py --events 50000

      - name: Package install smoke (pip install . + console entry)
        run: |
          python -m pip install .
          agenttrace --version
          agenttrace init --db smoke.db --agent ci --anchor
          agenttrace record examples/sample_session.jsonl --db smoke.db
          agenttrace verify --db smoke.db

      - name: Verify pyproject parses
        shell: bash
        run: |
          python - <<'EOF'
          try:
              import tomllib
          except ImportError:  # Python 3.9 无 tomllib，用 tomli 兜底（CI 已装）
              import tomli as tomllib
          with open('pyproject.toml', 'rb') as f:
              tomllib.load(f)
          print('pyproject OK')
          EOF

      - name: Verify zero-dependency claim
        shell: bash
        run: |
          python - <<'EOF'
          import ast, importlib.util, pathlib, sys, sysconfig
          stdlib_root = pathlib.Path(sysconfig.get_path('stdlib')).resolve()
          bad = []
          def stdlib_ok(top):
              if top == 'agenttrace':
                  return True
              try:
                  spec = importlib.util.find_spec(top)
              except (ImportError, ValueError):
                  return False
              if spec is None:
                  return False
              if spec.origin is None or spec.origin.startswith('<'):
                  return True  # 内建/冻结模块（sys、__future__ 等）
              p = pathlib.Path(spec.origin).resolve()
              return p.is_relative_to(stdlib_root)
          for p in pathlib.Path('agenttrace').glob('*.py'):
              tree = ast.parse(p.read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          top = a.name.split('.')[0]
                          if not stdlib_ok(top):
                              bad.append((p.name, a.name))
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      if node.level > 0:
                          continue  # 相对导入（from .x import y）→ 包内模块
                      top = node.module.split('.')[0]
                      if not stdlib_ok(top):
                          bad.append((p.name, node.module))
          assert not bad, f'非标准库依赖: {bad}'
          print('zero-dependency OK (stdlib-path scan, py3.9+ compatible)')
          EOF