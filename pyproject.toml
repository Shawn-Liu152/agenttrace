[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "1.0.0"
description = "AI Agent 取证审计工具 — 防篡改证据链（外部锚定）+ 风险分析 + 时间线回放报告"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AgentTrace contributors" }]
keywords = ["agent", "forensics", "audit", "hash-chain", "llm", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/yourname/agenttrace"

[tool.setuptools]
packages = ["agenttrace"]

[project.scripts]
agenttrace = "agenttrace.cli:main"